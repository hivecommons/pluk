name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-tag:
    name: Tag matches package.json version and is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compare tag to package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}; bump package.json before tagging"
            exit 1
          fi
      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not reachable from main"
            exit 1
          fi
      - name: CHANGELOG has a section for this version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## $ver" 'index($0, h " ")==1 || $0==h {f=1; next} f && /^## /{exit} f' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::CHANGELOG.md has no nonempty '## ${ver}' section; roll changelog.d/ fragments and bump before tagging"
            exit 1
          fi

  # Publishes with npm Trusted Publishing (OIDC); no NPM_TOKEN secret.
  # The npm-side Trusted Publisher for @hivecommons/pluk must match:
  #   provider: GitHub Actions, owner: hivecommons, repository: pluk,
  #   workflow filename: publish.yml, environment: (blank — this job uses none)
  publish:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1.
      - name: Ensure npm supports Trusted Publishing
        run: |
          have="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $have is too old for Trusted Publishing; upgrading"
            npm install -g npm@latest
          fi
          npm --version
      # Dependency lifecycle scripts must not run in the job that holds the
      # OIDC token used for npm provenance.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Smoke-test the packed tarball
        run: |
          tarball="$(npm pack --silent | tail -n1)"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$tarball"
          out="$(npx --no-install pluk version)"
          echo "$out"
          test "$out" = "@hivecommons/pluk ${GITHUB_REF_NAME#v}"
          test -d node_modules/@hivecommons/pluk/patterns
      - name: Require OIDC token for npm Trusted Publishing
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set; the job needs 'id-token: write' for npm Trusted Publishing; see runbooks/publish-failure.md"
            exit 1
          fi
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## $ver" 'index($0, h " ")==1 || $0==h {f=1; next} f && /^## /{exit} f' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it untouched"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
