# Advisory mutation-testing report (#405, #420). Report-only: stryker
# thresholds.break is null, every Stryker job is continue-on-error and none is
# a required check. Each source file is mutated in its own matrix job because
# the command runner replays the whole suite (30-50 s) per mutant, so a single
# job for the whole tree (or even for one large file) never finished inside
# its timeout and no report was ever written. Pull requests mutate only the
# changed src files; the nightly run mutates every file from scratch (no
# incremental restore, so a result is always a fresh measurement). A ratchet
# is a separate decision.
name: Mutation (advisory)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select files to mutate (one matrix entry per file)
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            list=$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'src/*.ts' 'src/**/*.ts' | { grep -v '\.test\.ts$' || true; })
          else
            list=$(git ls-files 'src/*.ts' 'src/**/*.ts' | { grep -v '\.test\.ts$' || true; })
          fi
          files=$(printf '%s\n' "$list" | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Mutating: $files"
          [ "$files" != "[]" ] || echo "No changed src files; skipping mutation run."

  mutation:
    needs: select
    if: needs.select.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.select.outputs.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install tmux for test/tmux-contract.test.js
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tmux

      - run: npm ci

      - name: Stryker (${{ matrix.file }}, fresh measurement)
        id: stryker
        timeout-minutes: 170
        continue-on-error: true
        env:
          FILE: ${{ matrix.file }}
        run: npx stryker run --mutate "$FILE" --force

      - name: Summary
        if: always()
        env:
          FILE: ${{ matrix.file }}
          OUTCOME: ${{ steps.stryker.outcome }}
        run: |
          {
            echo "## Mutation report (advisory) — \`$FILE\`"
            case "$OUTCOME" in
              success) echo "Measured." ;;
              *) echo "Not measured: Stryker exited \`$OUTCOME\` (timed out or failed); no score is reported." ;;
            esac
            if [ -f reports/mutation/mutation.json ]; then
              node -e 'const r=require("./reports/mutation/mutation.json");let k=0,s=0,t=0;for(const f of Object.values(r.files))for(const m of f.mutants){t++;if(m.status==="Killed"||m.status==="Timeout")k++;if(m.status==="Survived"||m.status==="NoCoverage")s++;}console.log(`\n${t} mutants: ${k} killed, ${s} survived/uncovered`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
