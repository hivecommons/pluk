name: AI Fix with Copilot

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to assign to Copilot
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  ai-fix-issue:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: hivecommons/infra/.github/workflows/reusable-ai-fix.yml@1416d68a1fd5bd475b96c8ddfcffc8539bfa6b08 # main@2026-09-24
    with:
      issue_number: ${{ github.event.inputs.issue_number || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  ai-fix-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(github.event.pull_request.labels.*.name, 'ai-fix-trusted')
      )
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: hivecommons/infra/.github/workflows/reusable-ai-fix.yml@1416d68a1fd5bd475b96c8ddfcffc8539bfa6b08 # main@2026-09-24
    with:
      issue_number: ''
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
